<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>El Sistema — Solo Leveling Dashboard</title>
  
  <!-- Configuración App iPhone (iOS PWA) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="El Sistema">
  <meta name="theme-color" content="#000000">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React-DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-black text-blue-50 selection:bg-blue-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // DATOS INICIALES POR DEFECTO
    const initialData = {
      weightLogs: [
        { semana: "Sem 1", fecha: "2026-08-01", peso: 96.0 },
        { semana: "Sem 2", fecha: "2026-08-08", peso: 95.3 },
        { semana: "Sem 3", fecha: "2026-08-15", peso: 94.6 },
        { semana: "Sem 4", fecha: "2026-08-22", peso: 94.0 },
        { semana: "Sem 5", fecha: "2026-08-29", peso: 93.2 },
        { semana: "Sem 6", fecha: "2026-09-05", peso: 92.5 }
      ],
      gymLogs: [
        { fecha: "Sesión 1", pressBanca: 50, curlBiceps: 12, repsTotales: 64 },
        { fecha: "Sesión 2", pressBanca: 55, curlBiceps: 14, repsTotales: 72 },
        { fecha: "Sesión 3", pressBanca: 60, curlBiceps: 14, repsTotales: 80 },
        { fecha: "Sesión 4", pressBanca: 65, curlBiceps: 16, repsTotales: 88 },
        { fecha: "Sesión 5", pressBanca: 70, curlBiceps: 18, repsTotales: 96 },
        { fecha: "Sesión 6", pressBanca: 75, curlBiceps: 18, repsTotales: 104 }
      ],
      basketLogs: [
        { fecha: "Sesión 1", tiempoFT: 26.0, tiempo3PT: 32.0 },
        { fecha: "Sesión 2", tiempoFT: 24.5, tiempo3PT: 29.0 },
        { fecha: "Sesión 3", tiempoFT: 22.0, tiempo3PT: 27.5 },
        { fecha: "Sesión 4", tiempoFT: 20.0, tiempo3PT: 25.0 },
        { fecha: "Sesión 5", tiempoFT: 18.5, tiempo3PT: 23.0 },
        { fecha: "Sesión 6", tiempoFT: 17.0, tiempo3PT: 21.0 }
      ]
    };

    const SoloLevelingDashboard = () => {
      // Cargar datos almacenados o iniciales
      const [appData, setAppData] = useState(() => {
        const saved = localStorage.getItem('SOLO_LEVELING_SYSTEM_DATA');
        return saved ? JSON.parse(saved) : initialData;
      });

      // Guardar en localStorage cada vez que cambia appData
      useEffect(() => {
        localStorage.setItem('SOLO_LEVELING_SYSTEM_DATA', JSON.stringify(appData));
      }, [appData]);

      // Estados para Modales y Formularios
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [formTab, setFormTab] = useState('peso');
      const [activeTab, setActiveTab] = useState('peso');

      // Formulario
      const [inputPeso, setInputPeso] = useState('');
      const [inputBench, setInputBench] = useState('');
      const [inputCurl, setInputCurl] = useState('');
      const [inputReps, setInputReps] = useState('');
      const [inputFT, setInputFT] = useState('');
      const [input3PT, setInput3PT] = useState('');

      const METAS = { pressBancaTarget: 90, curlBicepsTarget: 20, pesoInicial: 96.0 };

      // Resumen estadístico
      const statsSummary = useMemo(() => {
        const w = appData.weightLogs;
        const g = appData.gymLogs;
        const b = appData.basketLogs;

        const currentWeight = w.length > 0 ? w[w.length - 1].peso : METAS.pesoInicial;
        const weightChange = (currentWeight - METAS.pesoInicial).toFixed(1);

        const maxBench = g.length > 0 ? Math.max(...g.map(l => l.pressBanca || 0)) : 0;
        const maxCurl = g.length > 0 ? Math.max(...g.map(l => l.curlBiceps || 0)) : 0;
        const totalReps = g.reduce((acc, l) => acc + (l.repsTotales || 0), 0);

        const bestFT = b.length > 0 ? Math.min(...b.map(l => l.tiempoFT || 999)) : 0;
        const best3PT = b.length > 0 ? Math.min(...b.map(l => l.tiempo3PT || 999)) : 0;

        return {
          currentWeight,
          weightChange,
          maxBench,
          maxCurl,
          totalReps,
          bestFT: bestFT === 999 ? 0 : bestFT,
          best3PT: best3PT === 999 ? 0 : best3PT,
          benchProgress: Math.min((maxBench / METAS.pressBancaTarget) * 100, 100).toFixed(0),
          curlProgress: Math.min((maxCurl / METAS.curlBicepsTarget) * 100, 100).toFixed(0)
        };
      }, [appData]);

      // Guardar Entrada
      const handleSaveEntry = (e) => {
        e.preventDefault();
        const hoy = new Date().toISOString().slice(5, 10);

        if (formTab === 'peso') {
          if (!inputPeso) return;
          const nextSem = `Sem ${appData.weightLogs.length + 1}`;
          const newEntry = { semana: nextSem, fecha: hoy, peso: parseFloat(inputPeso) };
          setAppData(prev => ({ ...prev, weightLogs: [...prev.weightLogs, newEntry] }));
          setInputPeso('');
        } else if (formTab === 'gym') {
          if (!inputBench && !inputCurl) return;
          const nextSesion = `Sesión ${appData.gymLogs.length + 1}`;
          const newEntry = {
            fecha: nextSesion,
            pressBanca: parseFloat(inputBench) || 0,
            curlBiceps: parseFloat(inputCurl) || 0,
            repsTotales: parseInt(inputReps) || 0
          };
          setAppData(prev => ({ ...prev, gymLogs: [...prev.gymLogs, newEntry] }));
          setInputBench(''); setInputCurl(''); setInputReps('');
        } else if (formTab === 'basket') {
          if (!inputFT && !input3PT) return;
          const nextSesion = `Sesión ${appData.basketLogs.length + 1}`;
          const newEntry = {
            fecha: nextSesion,
            tiempoFT: parseFloat(inputFT) || 0,
            tiempo3PT: parseFloat(input3PT) || 0
          };
          setAppData(prev => ({ ...prev, basketLogs: [...prev.basketLogs, newEntry] }));
          setInputFT(''); setInput3PT('');
        }

        setIsModalOpen(false);
      };

      // Reset
      const handleResetData = () => {
        if (confirm("¿Estás seguro de reiniciar todos los datos a sus valores iniciales?")) {
          setAppData(initialData);
          localStorage.removeItem('SOLO_LEVELING_SYSTEM_DATA');
        }
      };

      return (
        <div className="min-h-screen bg-black text-blue-50 p-4 md:p-8 font-mono pb-20">
          <div className="fixed inset-0 pointer-events-none border-4 md:border-8 border-blue-900/30 shadow-[inset_0_0_100px_rgba(0,0,150,0.25)] z-40"></div>

          <div className="max-w-6xl mx-auto relative z-10 space-y-6">
            
            {/* ENCABEZADO Y BOTÓN DE REGISTRO TÁCTIL */}
            <div className="flex flex-col md:flex-row justify-between items-center gap-4 border-b border-blue-900/60 pb-4">
              <div>
                <h1 className="text-2xl md:text-4xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-cyan-300 to-purple-500 uppercase">
                  [ VENTANA DE ESTADO ]
                </h1>
                <p className="text-[10px] md:text-xs text-blue-400 tracking-[0.2em] uppercase">SISTEMA ACTIVO — MODO CAZADOR</p>
              </div>

              <div className="flex gap-2">
                <button 
                  onClick={() => setIsModalOpen(true)}
                  className="bg-blue-600 hover:bg-blue-500 text-black font-bold px-4 py-2.5 rounded text-xs uppercase tracking-wider shadow-[0_0_15px_rgba(59,130,246,0.8)] active:scale-95 transition-all flex items-center gap-2"
                >
                  <span className="text-sm">⚡</span> + Registrar en el Sistema
                </button>
                <button 
                  onClick={handleResetData}
                  className="bg-red-950/40 border border-red-800/60 text-red-400 px-3 py-2.5 rounded text-[10px] uppercase hover:bg-red-900/50"
                  title="Restablecer Datos"
                >
                  🔄
                </button>
              </div>
            </div>

            {/* FICHA TÉCNICA DE CAZADOR Y ESTADÍSTICAS */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              
              <div className="bg-gray-900/90 border border-blue-500/50 p-5 rounded shadow-[0_0_20px_rgba(59,130,246,0.15)] relative overflow-hidden flex flex-col justify-between">
                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-cyan-400 to-purple-600"></div>

                <div>
                  <h2 className="text-lg font-bold text-blue-300 border-b border-blue-800/60 pb-2 mb-3 uppercase flex justify-between">
                    <span>Jugador</span>
                    <span className="text-xs text-blue-500">#0096</span>
                  </h2>

                  <div className="space-y-2 text-xs md:text-sm">
                    <div className="flex justify-between"><span className="text-gray-400">Estatura:</span><span className="text-white font-bold">1.76 m</span></div>
                    <div className="flex justify-between"><span className="text-gray-400">Peso Base:</span><span className="text-gray-300">96.0 kg</span></div>
                    <div className="flex justify-between"><span className="text-gray-400">Peso Actual:</span><span className="text-cyan-300 font-bold">{statsSummary.currentWeight} kg</span></div>
                    <div className="flex justify-between">
                      <span className="text-gray-400">Cambio Total:</span>
                      <span className={`font-bold ${parseFloat(statsSummary.weightChange) <= 0 ? 'text-green-400' : 'text-red-400'}`}>
                        {statsSummary.weightChange} kg
                      </span>
                    </div>
                  </div>
                </div>

                <div className="pt-4 border-t border-blue-900/50 mt-4">
                  <div className="flex justify-between items-center mb-1">
                    <span className="text-base font-bold text-blue-300">NIVEL {12 + appData.gymLogs.length}</span>
                    <span className="text-[10px] text-blue-400">XP SISTEMA</span>
                  </div>
                  <div className="w-full bg-gray-800 h-2 rounded-full overflow-hidden border border-blue-900">
                    <div className="h-full bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,1)] transition-all duration-500" style={{ width: `${Math.min((appData.gymLogs.length * 15), 100)}%` }}></div>
                  </div>
                </div>
              </div>

              {/* ATRIBUTOS */}
              <div className="lg:col-span-2 bg-gray-900/90 border border-blue-500/50 p-5 rounded shadow-[0_0_20px_rgba(59,130,246,0.15)] space-y-3">
                <h2 className="text-lg font-bold text-blue-300 border-b border-blue-800/60 pb-2 uppercase">
                  ⚡ Atributos de Entrenamiento
                </h2>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                  <div className="bg-black/60 p-3 border border-red-900/40 rounded">
                    <div className="flex justify-between mb-1">
                      <span className="text-gray-400">FUERZA: Press Banca</span>
                      <span className="text-red-400 font-bold">{statsSummary.maxBench} kg / {METAS.pressBancaTarget} kg</span>
                    </div>
                    <div className="w-full bg-gray-800 h-1.5 rounded">
                      <div className="bg-red-500 h-1.5 rounded" style={{ width: `${statsSummary.benchProgress}%` }}></div>
                    </div>
                  </div>

                  <div className="bg-black/60 p-3 border border-purple-900/40 rounded">
                    <div className="flex justify-between mb-1">
                      <span className="text-gray-400">FUERZA: Curl Bíceps</span>
                      <span className="text-purple-400 font-bold">{statsSummary.maxCurl} kg / {METAS.curlBicepsTarget} kg</span>
                    </div>
                    <div className="w-full bg-gray-800 h-1.5 rounded">
                      <div className="bg-purple-500 h-1.5 rounded" style={{ width: `${statsSummary.curlProgress}%` }}></div>
                    </div>
                  </div>

                  <div className="bg-black/60 p-3 border border-cyan-900/40 rounded flex justify-between items-center">
                    <span className="text-gray-400">RÉCORD TIRO LIBRE (100)</span>
                    <span className="text-cyan-400 font-bold text-sm">{statsSummary.bestFT} min</span>
                  </div>

                  <div className="bg-black/60 p-3 border border-yellow-900/40 rounded flex justify-between items-center">
                    <span className="text-gray-400">RÉCORD 3 PUNTOS (70)</span>
                    <span className="text-yellow-400 font-bold text-sm">{statsSummary.best3PT} min</span>
                  </div>
                </div>
              </div>

            </div>

            {/* PESTAÑAS DE GRÁFICAS */}
            <div className="bg-gray-900/90 border border-blue-500/50 p-5 rounded shadow-[0_0_20px_rgba(59,130,246,0.15)] space-y-4">
              <div className="flex flex-wrap gap-2 border-b border-blue-900/60 pb-3">
                <button onClick={() => setActiveTab('peso')} className={`px-3 py-1.5 text-xs font-bold uppercase rounded ${activeTab === 'peso' ? 'bg-blue-600 text-white' : 'bg-black/50 text-gray-400'}`}>⚖️ Peso</button>
                <button onClick={() => setActiveTab('tiros')} className={`px-3 py-1.5 text-xs font-bold uppercase rounded ${activeTab === 'tiros' ? 'bg-cyan-600 text-white' : 'bg-black/50 text-gray-400'}`}>🎯 Tiros</button>
                <button onClick={() => setActiveTab('fuerza')} className={`px-3 py-1.5 text-xs font-bold uppercase rounded ${activeTab === 'fuerza' ? 'bg-red-600 text-white' : 'bg-black/50 text-gray-400'}`}>🏋️ Fuerza</button>
                <button onClick={() => setActiveTab('resistencia')} className={`px-3 py-1.5 text-xs font-bold uppercase rounded ${activeTab === 'resistencia' ? 'bg-yellow-600 text-white' : 'bg-black/50 text-gray-400'}`}>🔥 Resistencia</button>
              </div>

              <div className="bg-black/70 p-4 border border-blue-900/40 rounded">
                {activeTab === 'peso' && (
                  <div className="h-56 w-full flex items-end justify-between gap-2 pt-6 pb-2 px-1 border-b border-blue-900/60 relative">
                    <div className="absolute top-6 left-0 right-0 border-b border-dashed border-red-500/40 flex justify-end">
                      <span className="text-[9px] text-red-400 bg-black/80 px-1 -mt-2">Base 96.0 kg</span>
                    </div>
                    {appData.weightLogs.map((log, index) => (
                      <div key={index} className="flex-1 flex flex-col items-center gap-1">
                        <span className="text-[8px] text-cyan-300">{log.peso}</span>
                        <div className="w-full bg-gradient-to-t from-blue-900 to-cyan-400 rounded-t" style={{ height: `${Math.max(((log.peso - 85) / (98 - 85)) * 100, 10)}%` }}></div>
                        <span className="text-[8px] text-gray-400 truncate w-full text-center">{log.semana}</span>
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === 'tiros' && (
                  <div className="h-56 w-full flex items-end justify-between gap-3 pt-6 pb-2 px-1 border-b border-blue-900/60">
                    {appData.basketLogs.map((log, index) => (
                      <div key={index} className="flex-1 flex items-end justify-center gap-1 h-full">
                        <div className="flex-1 bg-cyan-500/80 rounded-t" style={{ height: `${(log.tiempoFT / 35) * 100}%` }}></div>
                        <div className="flex-1 bg-yellow-500/80 rounded-t" style={{ height: `${(log.tiempo3PT / 35) * 100}%` }}></div>
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === 'fuerza' && (
                  <div className="h-56 w-full flex items-end justify-between gap-3 pt-6 pb-2 px-1 border-b border-blue-900/60">
                    {appData.gymLogs.map((log, index) => (
                      <div key={index} className="flex-1 flex items-end justify-center gap-1 h-full">
                        <div className="flex-1 bg-red-600/80 rounded-t" style={{ height: `${(log.pressBanca / METAS.pressBancaTarget) * 100}%` }}></div>
                        <div className="flex-1 bg-purple-600/80 rounded-t" style={{ height: `${(log.curlBiceps / METAS.curlBicepsTarget) * 100}%` }}></div>
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === 'resistencia' && (
                  <div className="h-56 w-full flex items-end justify-between gap-2 pt-6 pb-2 px-1 border-b border-blue-900/60">
                    {appData.gymLogs.map((log, index) => (
                      <div key={index} className="flex-1 flex flex-col items-center h-full justify-end">
                        <div className="w-full bg-gradient-to-t from-yellow-700 to-yellow-400 rounded-t" style={{ height: `${(log.repsTotales / 120) * 100}%` }}></div>
                        <span className="text-[8px] text-gray-500 mt-1">{log.fecha}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>

          </div>

          {/* MODAL TÁCTIL PARA REGISTRO DE DATOS (IPHONE / PC) */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-gray-900 border-2 border-blue-500 p-6 rounded-lg w-full max-w-md shadow-[0_0_30px_rgba(59,130,246,0.5)] space-y-5">
                
                <div className="flex justify-between items-center border-b border-blue-800 pb-3">
                  <h3 className="text-lg font-bold text-blue-300 uppercase">[ Misión Completa ]</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-white text-xl">✕</button>
                </div>

                {/* Selector de categoría */}
                <div className="flex border-b border-gray-800 text-xs">
                  <button 
                    onClick={() => setFormTab('peso')} 
                    className={`flex-1 py-2 font-bold uppercase border-b-2 ${formTab === 'peso' ? 'border-blue-500 text-blue-400' : 'border-transparent text-gray-500'}`}
                  >
                    ⚖️ Peso
                  </button>
                  <button 
                    onClick={() => setFormTab('gym')} 
                    className={`flex-1 py-2 font-bold uppercase border-b-2 ${formTab === 'gym' ? 'border-red-500 text-red-400' : 'border-transparent text-gray-500'}`}
                  >
                    🏋️ Gym
                  </button>
                  <button 
                    onClick={() => setFormTab('basket')} 
                    className={`flex-1 py-2 font-bold uppercase border-b-2 ${formTab === 'basket' ? 'border-cyan-500 text-cyan-400' : 'border-transparent text-gray-500'}`}
                  >
                    🎯 Basket
                  </button>
                </div>

                <form onSubmit={handleSaveEntry} className="space-y-4 text-sm">
                  {formTab === 'peso' && (
                    <div>
                      <label className="block text-xs text-gray-400 mb-1">PESO CORPORAL HOY (KG)</label>
                      <input 
                        type="number" 
                        step="0.1" 
                        placeholder="Ej. 94.5" 
                        value={inputPeso} 
                        onChange={e => setInputPeso(e.target.value)}
                        className="w-full bg-black border border-blue-900 rounded p-2 text-white focus:border-blue-400 outline-none"
                        required
                      />
                    </div>
                  )}

                  {formTab === 'gym' && (
                    <>
                      <div>
                        <label className="block text-xs text-gray-400 mb-1">PRESS BANCA - CARGA MÁXIMA (KG)</label>
                        <input 
                          type="number" 
                          step="0.5" 
                          placeholder="Ej. 80" 
                          value={inputBench} 
                          onChange={e => setInputBench(e.target.value)}
                          className="w-full bg-black border border-blue-900 rounded p-2 text-white focus:border-red-400 outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs text-gray-400 mb-1">CURL BÍCEPS - MANCUERNA (KG)</label>
                        <input 
                          type="number" 
                          step="0.5" 
                          placeholder="Ej. 18" 
                          value={inputCurl} 
                          onChange={e => setInputCurl(e.target.value)}
                          className="w-full bg-black border border-blue-900 rounded p-2 text-white focus:border-purple-400 outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs text-gray-400 mb-1">REPETICIONES TOTALES DE LA SESIÓN</label>
                        <input 
                          type="number" 
                          placeholder="Ej. 96" 
                          value={inputReps} 
                          onChange={e => setInputReps(e.target.value)}
                          className="w-full bg-black border border-blue-900 rounded p-2 text-white focus:border-yellow-400 outline-none"
                        />
                      </div>
                    </>
                  )}

                  {formTab === 'basket' && (
                    <>
                      <div>
                        <label className="block text-xs text-gray-400 mb-1">TIEMPO META 100 TIROS LIBRES (MINUTOS)</label>
                        <input 
                          type="number" 
                          step="0.1" 
                          placeholder="Ej. 18.5" 
                          value={inputFT} 
                          onChange={e => setInputFT(e.target.value)}
                          className="w-full bg-black border border-blue-900 rounded p-2 text-white focus:border-cyan-400 outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs text-gray-400 mb-1">TIEMPO META 70 TRIPLES (MINUTOS)</label>
                        <input 
                          type="number" 
                          step="0.1" 
                          placeholder="Ej. 22.0" 
                          value={input3PT} 
                          onChange={e => setInput3PT(e.target.value)}
                          className="w-full bg-black border border-blue-900 rounded p-2 text-white focus:border-yellow-400 outline-none"
                        />
                      </div>
                    </>
                  )}

                  <button 
                    type="submit" 
                    className="w-full bg-blue-600 hover:bg-blue-500 text-black font-bold py-3 rounded uppercase tracking-widest text-xs shadow-[0_0_15px_rgba(59,130,246,0.8)] mt-2"
                  >
                    [ GUARDAR EN EL SISTEMA ]
                  </button>
                </form>

              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SoloLevelingDashboard />);
  </script>
</body>
</html>
